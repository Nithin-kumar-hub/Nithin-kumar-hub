name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Nithin-kumar-hub
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%231ed760&color_dots=%230d1117,%2313261b,%231f5b35,%231ed760,%23a8ffc8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2320d7ff&color_dots=%230d1117,%23132836,%23205c72,%2320d7ff,%23b8f5ff
            dist/github-snake-light.svg?palette=github-light&color_snake=%23118b45&color_dots=%23ebedf0,%23d6f5e2,%23a9e7c1,%2357c889,%23118b45
      - name: Publish output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
